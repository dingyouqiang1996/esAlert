name: Build and Test Docker Image

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-24.04-arm 

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: go build
        run: |
          go mod tidy
          go build

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: esAlert
          path: esAlert
          retention-days: 30

